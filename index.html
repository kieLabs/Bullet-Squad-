  <div id="game-container">
    <canvas id="game-canvas"></canvas>

            <span class="pill-value" id="hud-squad-count">3</span>

          <div class="counter-pill enemy-pill">

        <div class="boss-warning" id="hud-boss-warning">WARNING: BOSS APPROACHING</div>

          <span id="hud-boss-name">GIANT WAR BEAST</span>

          <button id="btn-settings" class="menu-btn sub-btn">SETTINGS</button>

          <button id="btn-pause-settings" class="menu-btn sub-btn">SETTINGS</button>
          <button id="btn-pause-home" class="menu-btn danger-btn">MAIN MENU</button>
        </div>
      </div>

      <div class="modal-card results-card">
        <div class="results-banner victory-banner">VICTORY!</div>

          <div class="res-row"><span>Enemies Defeated</span><strong id="go-enemies">0</strong></div>

        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js">__CLOSE_SCRIPT__
</body>

<script type="text/plain" data-path="style.css">
:root {
  --bg-dark: #070d19;
  --panel-bg: rgba(11, 22, 44, 0.88);
  --panel-border: rgba(64, 156, 255, 0.42);
  --accent-blue: #1a73e8;
  --accent-cyan: #00e5ff;
  --accent-gold: #fcc934;
  --accent-green: #2ecc71;
  --accent-red: #ff3b30;
  --text-light: #f4f8ff;
  --text-muted: #9aaec9;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-dark);
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  color: var(--text-light);
}

#game-container {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

#game-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

.hidden {
  display: none !important;
}

.floating-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 15;
  overflow: hidden;
}

.floating-text {
  position: absolute;
  font-weight: 800;
  font-size: 1.05rem;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.85);
  transform: translate(-50%, -50%);
  animation: floatUp 0.75s ease-out forwards;
}

@keyframes floatUp {
  0% { opacity: 1; transform: translate(-50%, 0) scale(0.9); }
  40% { opacity: 1; transform: translate(-50%, -22px) scale(1.1); }
  100% { opacity: 0; transform: translate(-50%, -48px) scale(0.95); }
}

.fps-counter {
  position: absolute;
  bottom: 8px;
  left: 8px;
  background: rgba(0, 0, 0, 0.65);
  color: #81c995;
  font-family: monospace;
  font-size: 12px;
  padding: 3px 7px;
  border-radius: 4px;
  z-index: 50;
  pointer-events: none;
}

.hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 20;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px;
}

.hud-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  width: 100%;
  max-width: 920px;
  margin: 0 auto;
}

.hud-box {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  padding: 8px 12px;
  backdrop-filter: blur(6px);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
}

.hud-left {
  min-width: 135px;
}

.hud-title {
  font-weight: 900;
  font-size: 1rem;
  color: var(--accent-cyan);
  letter-spacing: 0.5px;
}

.hud-subtitle {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-bottom: 5px;
}

.progress-bar-bg {
  width: 100%;
  height: 8px;
  background: rgba(255, 255, 255, 0.14);
  border-radius: 4px;
  overflow: hidden;
}

.progress-bar-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
  transition: width 0.15s linear;
}

.hud-center {
  display: flex;
  gap: 10px;
  align-items: center;
}

.counter-pill {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 4px 12px;
  border-radius: 8px;
  min-width: 74px;
}

.squad-pill {
  background: rgba(26, 115, 232, 0.35);
  border: 1px solid #4285f4;
}

.enemy-pill {
  background: rgba(217, 48, 37, 0.35);
  border: 1px solid #f28b82;

.pill-label {

}

.pill-value {

.pulse-scale {

}

@keyframes pulsePop {
  0% { transform: scale(1); }

<script type="text/plain" data-path="js/main.js">
import { StorageManager } from './storage.js';
import { SettingsManager } from './settings.js';
import { AudioManager } from './audio.js';
import { UpgradesManager } from './upgrades.js';
import { MissionsManager } from './missions.js';
import { UIManager } from './ui.js';
import { Game } from './game.js';

window.addEventListener('DOMContentLoaded', () => {
  const storage = new StorageManager();
  const settings = new SettingsManager(storage);
  const audio = new AudioManager(settings);
  const upgrades = new UpgradesManager(storage);
  const missions = new MissionsManager(storage);

  const canvas = document.getElementById('game-canvas');
  const game = new Game({
    canvas,
    storage,
    settings,
    audio,
    upgrades,
    missions
  });

  const ui = new UIManager({
    game,
    storage,
    settings,
    audio,
    upgrades,
    missions
  });

  game.setUI(ui);
  game.init();
  ui.refreshAll();

  const unlockAudio = () => {
    audio.unlock();
    window.removeEventListener('pointerdown', unlockAudio);
    window.removeEventListener('keydown', unlockAudio);
  };
  window.addEventListener('pointerdown', unlockAudio);
  window.addEventListener('keydown', unlockAudio);
});
</script>

<script type="text/plain" data-path="js/storage.js">
const STORAGE_KEY = 'BULLET_SQUAD_GAMERKIE_SAVE_V1';

export class StorageManager {
  constructor() {
    this.data = this.load();
  }

  getDefaultData() {
    return {
      coins: 250,
      currentLevel: 1,
      highestLevel: 1,
      highestSquad: 3,
      totalEnemiesDefeated: 0,
      totalBossesDefeated: 0,
      selectedCharacter: 'elite_commander',
      unlockedCharacters: ['elite_commander'],
      selectedWeapon: 'assault_rifle',
      unlockedWeapons: ['assault_rifle'],
      weaponLevels: {
        assault_rifle: 1,
        smg: 1,
        heavy_mg: 1,
        minigun: 1,
        shotgun: 1,
        laser_gun: 1,
        plasma_cannon: 1,
        rocket_launcher: 1,
        golden_minigun: 1,
        legendary_energy: 1
      },
      upgrades: {
        squadCapacity: 1,
        damageBoost: 1,
        fireRateBoost: 1,
        healthBoost: 1,
        specialAbility: 1,
        startingSquad: 1
      },
      dailyStats: {
        dateKey: this.getLocalDateKey(),
        enemies: 0,
        coins: 0,
        levels: 0,
        maxSquad: 3,
        bosses: 0,
        claimedMissions: {}
      },
      dailyRewards: {
        lastClaimDate: '',
        streak: 0
      },
      achievements: {
        first_blood: false,
        army_builder: false,
        weapon_master: false,
        boss_slayer: false,
        gold_collector: false,
        legendary_commander: false,
        endless_survivor: false
      },
      claimedAchievements: {},
      settings: {
        music: true,
        sound: true,
        masterVolume: 0.8,
        graphics: 'HIGH',
        cameraShake: true,
        vibration: true,
        language: 'EN',
        sensitivity: 1.0,
        showFps: false
      }
    };
  }

  getLocalDateKey() {
    const d = new Date();
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return this.getDefaultData();
      const parsed = JSON.parse(raw);
      const def = this.getDefaultData();
      const merged = {
        ...def,
        ...parsed,
        weaponLevels: { ...def.weaponLevels, ...(parsed.weaponLevels || {}) },
        upgrades: { ...def.upgrades, ...(parsed.upgrades || {}) },
        dailyStats: { ...def.dailyStats, ...(parsed.dailyStats || {}) },
        dailyRewards: { ...def.dailyRewards, ...(parsed.dailyRewards || {}) },
        achievements: { ...def.achievements, ...(parsed.achievements || {}) },
        claimedAchievements: { ...(parsed.claimedAchievements || {}) },
        settings: { ...def.settings, ...(parsed.settings || {}) }
      };
      if (merged.dailyStats.dateKey !== this.getLocalDateKey()) {
        merged.dailyStats = {
          dateKey: this.getLocalDateKey(),
          enemies: 0,
          coins: 0,
          levels: 0,
          maxSquad: 3,
          bosses: 0,
          claimedMissions: {}
        };
      }
      return merged;
    } catch (e) {
      return this.getDefaultData();
    }
  }

  save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
    } catch (e) {}
  }

  addCoins(amount) {
    const valid = Math.max(0, Math.floor(Number(amount) || 0));
    this.data.coins += valid;
    this.data.dailyStats.coins += valid;
    if (this.data.coins >= 5000) {
      this.data.achievements.gold_collector = true;
    }
    this.save();
    return this.data.coins;
  }

  spendCoins(amount) {
    const cost = Math.max(0, Math.floor(Number(amount) || 0));
    if (this.data.coins < cost) return false;
    this.data.coins -= cost;
    this.save();
    return true;
  }

  resetAll() {
    this.data = this.getDefaultData();
    this.save();
  }
}
</script>

<script type="text/plain" data-path="js/settings.js">
export class SettingsManager {
  constructor(storage) {
    this.storage = storage;
    this.listeners = [];
  }

  get state() {
    return this.storage.data.settings;
  }

  set(key, value) {
    if (key in this.storage.data.settings) {
      this.storage.data.settings[key] = value;
      this.storage.save();
      this.notify();
    }
  }

  toggle(key) {
    if (typeof this.storage.data.settings[key] === 'boolean') {
      this.storage.data.settings[key] = !this.storage.data.settings[key];
      this.storage.save();
      this.notify();
    }
  }

  onChange(fn) {
    this.listeners.push(fn);
  }

  notify() {
    for (const fn of this.listeners) {
      fn(this.state);
    }
  }

  vibrate(ms = 25) {
    if (this.state.vibration && navigator.vibrate) {
      try {
        navigator.vibrate(ms);
      } catch (e) {}
    }
  }
}
</script>

<script type="text/plain" data-path="js/audio.js">
export class AudioManager {
  constructor(settings) {
    this.settings = settings;
    this.ctx = null;
    this.noiseBuffer = null;
    this.gritBuffer = null;
    this.musicTimer = null;
    this.currentMusicTrack = null;
    this.stepIndex = 0;

    this.settings.onChange(() => {
      if (!this.settings.state.music) {
        this.stopMusic();
      } else if (this.currentMusicTrack && !this.musicTimer) {
        this.playMusic(this.currentMusicTrack);
      }
    });
  }

  unlock() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        this.ctx = new AudioCtx();
        this.buildNoiseBuffers();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    if (this.settings.state.music && !this.musicTimer) {
      this.playMusic(this.currentMusicTrack || 'menu');
    }
  }

  buildNoiseBuffers() {
    if (!this.ctx) return;
    const sr = this.ctx.sampleRate;
    this.noiseBuffer = this.ctx.createBuffer(1, sr, sr);
    const data = this.noiseBuffer.getChannelData(0);
    for (let i = 0; i < sr; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    this.gritBuffer = this.ctx.createBuffer(1, sr, sr);
    const gritData = this.gritBuffer.getChannelData(0);
    const grit = 4;
    for (let i = 0; i < sr; i += grit) {
      const val = Math.random() * 2 - 1;
      for (let j = 0; j < grit && i + j < sr; j++) {
        gritData[i + j] = val;
      }
    }
  }

  getGain(multiplier = 1.0) {
    if (!this.ctx || !this.settings.state.sound) return null;
    const gain = this.ctx.createGain();
    const vol = Math.max(0.0001, this.settings.state.masterVolume * multiplier);
    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
    gain.connect(this.ctx.destination);
    return gain;
  }

  playTone(freq, endFreq, duration, type = 'sine', vol = 0.25) {
    if (!this.ctx || !this.settings.state.sound) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.getGain(vol);
    if (!gain) return;

    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, freq), now);
    if (endFreq && endFreq !== freq) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + duration);
    }
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    osc.connect(gain);
    osc.start(now);
    osc.stop(now + duration + 0.01);
  }

  playNoise(duration, filterFreq = 900, filterType = 'lowpass', useGrit = false, vol = 0.3) {
    if (!this.ctx || !this.settings.state.sound || !this.noiseBuffer) return;
    const now = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = useGrit ? this.gritBuffer : this.noiseBuffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.setValueAtTime(filterFreq, now);
    filter.frequency.exponentialRampToValueAtTime(Math.max(60, filterFreq * 0.2), now + duration);

    const gain = this.getGain(vol);
    if (!gain) return;
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    src.connect(filter);
    filter.connect(gain);
    src.start(now);
    src.stop(now + duration + 0.01);
  }

  playSfx(name) {
    if (!this.ctx || !this.settings.state.sound) return;
    switch (name) {
      case 'gun_fire':
        this.playNoise(0.07, 1400, 'bandpass', false, 0.18);
        this.playTone(190, 55, 0.06, 'triangle', 0.16);
        break;
      case 'minigun_fire':
        this.playNoise(0.045, 2100, 'bandpass', true, 0.15);
        this.playTone(260, 90, 0.04, 'sawtooth', 0.12);
        break;
      case 'laser_fire':
        this.playTone(1100, 220, 0.11, 'sawtooth', 0.18);
        break;
      case 'bullet_impact':
        this.playNoise(0.035, 900, 'lowpass', false, 0.1);
        break;
      case 'enemy_hit':
        this.playTone(140, 75, 0.05, 'square', 0.12);
        break;
      case 'enemy_defeat':
        this.playTone(240, 65, 0.12, 'sawtooth', 0.18);
        this.playNoise(0.09, 650, 'lowpass', true, 0.15);
        break;
      case 'soldier_run':
        this.playNoise(0.025, 420, 'lowpass', false, 0.06);
        break;
      case 'soldier_join':
        this.playTone(440, 880, 0.14, 'triangle', 0.22);
        break;
      case 'gate_positive':
        this.playTone(523.25, 1046.5, 0.22, 'sine', 0.28);
        break;
      case 'gate_negative':
        this.playTone(300, 110, 0.25, 'sawtooth', 0.28);
        break;
      case 'coin':
        this.playTone(987.77, 1318.5, 0.12, 'sine', 0.22);
        break;
      case 'weapon_upgrade':
        this.playTone(440, 880, 0.12, 'triangle', 0.25);
        setTimeout(() => this.playTone(659.25, 1318.5, 0.18, 'triangle', 0.25), 90);
        break;
      case 'powerup':
        this.playTone(392, 784, 0.15, 'sine', 0.25);
        setTimeout(() => this.playTone(587.33, 1174.66, 0.2, 'sine', 0.25), 100);
        break;
      case 'boss_appear':
        this.playTone(110, 45, 0.65, 'sawtooth', 0.38);
        this.playNoise(0.5, 350, 'lowpass', true, 0.3);
        break;
      case 'boss_attack':
        this.playTone(160, 50, 0.35, 'square', 0.32);
        this.playNoise(0.3, 600, 'lowpass', true, 0.28);
        break;
      case 'explosion':
        this.playNoise(0.48, 480, 'lowpass', true, 0.42);
        this.playTone(120, 30, 0.45, 'triangle', 0.35);
        break;
      case 'click':
        this.playTone(1174.66, 1174.66, 0.025, 'sine', 0.15);
        break;
      case 'victory':
        [523.25, 659.25, 783.99, 1046.5].forEach((n, idx) => {
          setTimeout(() => this.playTone(n, n, 0.2, 'triangle', 0.26), idx * 110);
        });
        break;
      case 'gameover':
        [392.0, 349.23, 329.63, 261.63].forEach((n, idx) => {
          setTimeout(() => this.playTone(n, n * 0.92, 0.26, 'sawtooth', 0.24), idx * 140);
        });
        break;
    }
  }

  playMusic(track = 'menu') {
    this.currentMusicTrack = track;
    this.stopMusic();
    if (!this.ctx || !this.settings.state.music) return;

    const patterns = {
      menu: { tempo: 420, notes: [110, 130.81, 146.83, 164.81, 146.83, 130.81] },
      battle: { tempo: 240, notes: [146.83, 146.83, 174.61, 196.0, 146.83, 220.0, 196.0, 174.61] },
      intense: { tempo: 190, notes: [164.81, 196.0, 220.0, 246.94, 220.0, 196.0, 164.81, 146.83] },
      boss: { tempo: 170, notes: [98.0, 103.83, 98.0, 116.54, 98.0, 130.81, 123.47, 103.83] }
    };

    const active = patterns[track] || patterns.menu;
    this.stepIndex = 0;

    this.musicTimer = setInterval(() => {
      if (!this.ctx || !this.settings.state.music || this.ctx.state !== 'running') return;
      const freq = active.notes[this.stepIndex % active.notes.length];
      const now = this.ctx.currentTime;

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const vol = Math.max(0.0001, this.settings.state.masterVolume * 0.075);

      osc.type = track === 'boss' ? 'sawtooth' : 'triangle';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + (active.tempo / 1000) * 0.9);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + (active.tempo / 1000));

      this.stepIndex++;
    }, active.tempo);
  }

  stopMusic() {
    if (this.musicTimer) {
      clearInterval(this.musicTimer);
      this.musicTimer = null;
    }
  }
}
</script>

export const WEAPON_TIER_NAMES = [
  'Level 1: Basic Weapon',
  'Level 2: Faster Fire Rate',
  'Level 3: Increased Damage',
  'Level 4: Double Barrel',
  'Level 5: Heavy Weapon',
  'Level 6: Golden Weapon',
  'Level 7: Energy Weapon'
];

export function getWeaponSpec(weaponId, tierLevel = 1) {
  const base = WEAPON_CATALOG.find(w => w.id === weaponId) || WEAPON_CATALOG[0];
  const tier = Math.max(1, Math.min(7, tierLevel));

  let damageMult = 1 + (tier - 1) * 0.22;
  let rateMult = 1 + (tier >= 2 ? 0.18 : 0) + (tier - 1) * 0.08;
  let extraPellets = tier >= 4 ? 1 : 0;
  let visualColor = base.color;
  let projColor = base.projectileColor;

  if (tier === 6) {
    visualColor = 0xfcc934;
    projColor = 0xfff59d;
  } else if (tier === 7) {
    visualColor = 0x00e5ff;
    projColor = 0x80d8ff;
    damageMult += 0.35;
  }

  return {
    ...base,
    tier,
    tierName: WEAPON_TIER_NAMES[tier - 1],
    effectiveDamage: base.baseDamage * damageMult,
    effectiveFireRate: base.fireRate * rateMult,
    effectivePellets: base.pellets + extraPellets,
    visualColor,
    projColor
  };
}

export function buildWeaponMesh(weaponId, tier = 1) {
  const spec = getWeaponSpec(weaponId, tier);
  const group = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({
    color: spec.visualColor,
    metalness: tier >= 6 ? 0.85 : 0.45,
    roughness: tier >= 6 ? 0.2 : 0.5,
    emissive: tier === 7 ? 0x004d66 : 0x000000
  });

  const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.2, 0.55), bodyMat);
  group.add(receiver);

  const barrelCount = spec.tier >= 4 ? 2 : 1;
  for (let b = 0; b < barrelCount; b++) {
    const offset = barrelCount === 2 ? (b === 0 ? -0.05 : 0.05) : 0;
    const barrel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.035, 0.035, 0.55, 8),
      bodyMat
    );
    barrel.rotation.x = Math.PI / 2;
    barrel.position.set(offset, 0.04, -0.45);
    group.add(barrel);
  }

  if (spec.tier >= 5) {
    const drum = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.12, 0.16, 10),
      new THREE.MeshStandardMaterial({ color: 0x222222 })
    );
    drum.rotation.z = Math.PI / 2;
    drum.position.set(0, -0.12, -0.05);
    group.add(drum);
  }

  return group;
}

  constructor(storage) {

  getUpgradeCost(key) {
    const def = UPGRADE_DEFINITIONS.find(u => u.key === key);
    const lvl = this.getUpgradeLevel(key);
    return Math.floor((def ? def.baseCost : 180) * Math.pow(1.42, lvl - 1));
  }

  buyUpgrade(key) {

    if (!this.storage.spendCoins(cost)) return false;
    this.storage.data.upgrades[key] = this.getUpgradeLevel(key) + 1;

    return true;

    return 110 + this.getUpgradeLevel('squadCapacity') * 25;

    return 25 + (this.getUpgradeLevel('healthBoost') - 1) * 10;
  }

export const ACHIEVEMENTS_LIST = [

  { id: 'army_builder', title: 'Army Builder', desc: 'Command a squad of 50+ soldiers simultaneously.', reward: 350 },

  { id: 'endless_survivor', title: 'Endless Survivor', desc: 'Survive 120 seconds in Endless War or Survival Mode.', reward: 800 }
];

export const DAILY_REWARD_TIERS = [150, 250, 400, 600, 850, 1200, 2000];

export class MissionsManager {
  constructor(storage) {
    this.storage = storage;
  }

  recordEnemyDefeated() {
    const d = this.storage.data;
    d.totalEnemiesDefeated++;
    d.dailyStats.enemies++;
    d.achievements.first_blood = true;
    this.storage.save();
  }

  recordBossDefeated() {
    const d = this.storage.data;
    d.totalBossesDefeated++;
    d.dailyStats.bosses++;
    if (d.totalBossesDefeated >= 5) {
      d.achievements.boss_slayer = true;
    }
    this.storage.save();
  }

  recordSquadSize(count) {
    const d = this.storage.data;
    if (count > d.highestSquad) d.highestSquad = count;
    if (count > d.dailyStats.maxSquad) d.dailyStats.maxSquad = count;
    if (count >= 50) d.achievements.army_builder = true;
    this.storage.save();
  }

  recordLevelCompleted(levelNum) {
    const d = this.storage.data;
    d.dailyStats.levels++;
    if (levelNum >= 25) {
      d.achievements.legendary_commander = true;
    }
    this.storage.save();
  }

  claimDailyMission(missionId) {
    const m = DAILY_MISSIONS.find(x => x.id === missionId);
    if (!m) return false;
    const stats = this.storage.data.dailyStats;
    if (stats.claimedMissions[missionId]) return false;
    if ((stats[m.statKey] || 0) < m.target) return false;

    stats.claimedMissions[missionId] = true;
    this.storage.addCoins(m.reward);
    this.storage.save();
    return true;
  }

  claimAchievement(achId) {
    const ach = ACHIEVEMENTS_LIST.find(x => x.id === achId);
    if (!ach) return false;
    if (!this.storage.data.achievements[achId]) return false;
    if (this.storage.data.claimedAchievements[achId]) return false;

    this.storage.data.claimedAchievements[achId] = true;
    this.storage.addCoins(ach.reward);
    this.storage.save();
    return true;
  }

  canClaimDailyLogin() {
    const today = this.storage.getLocalDateKey();
    return this.storage.data.dailyRewards.lastClaimDate !== today;
  }

  claimDailyLogin() {
    if (!this.canClaimDailyLogin()) return 0;
    const dr = this.storage.data.dailyRewards;
    const reward = DAILY_REWARD_TIERS[dr.streak % DAILY_REWARD_TIERS.length];
    dr.lastClaimDate = this.storage.getLocalDateKey();
    dr.streak = (dr.streak + 1) % DAILY_REWARD_TIERS.length;
    this.storage.addCoins(reward);
    this.storage.save();
    return reward;
  }
}

import * as THREE from 'three';
import { CHARACTER_CATALOG } from './upgrades.js';
import { buildWeaponMesh } from './weapons.js';

export class PlayerCommander {
  constructor(scene) {
    this.scene = scene;
    this.root = new THREE.Group();
    this.scene.add(this.root);

    this.x = 0;
    this.y = 0;
    this.z = 0;
    this.vy = 0;
    this.isJumping = false;
    this.animState = 'idle';
    this.animTime = 0;
    this.recoilOffset = 0;
    this.upgradePulse = 0;

    this.leftArm = null;
    this.rightArm = null;
    this.leftLeg = null;
    this.rightLeg = null;
    this.headGroup = null;
    this.weaponSocket = null;

    this.buildCommanderModel('elite_commander', 'assault_rifle', 1);
  }

  buildCommanderModel(characterId, weaponId, weaponTier) {
    while (this.root.children.length > 0) {
      this.root.remove(this.root.children[0]);
    }

    const spec = CHARACTER_CATALOG.find(c => c.id === characterId) || CHARACTER_CATALOG[0];

    const skinMat = new THREE.MeshStandardMaterial({ color: spec.skinColor, roughness: 0.6 });
    const vestMat = new THREE.MeshStandardMaterial({ color: spec.vestColor, roughness: 0.4, metalness: 0.25 });
    const pantsMat = new THREE.MeshStandardMaterial({ color: spec.trouserColor, roughness: 0.7 });
    const bootMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.5 });
    const beltMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8, roughness: 0.25 });

    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.82, 0.42), vestMat);
    torso.position.y = 1.15;
    torso.castShadow = true;
    this.root.add(torso);

    const ammoBelt = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.14, 0.46), beltMat);
    ammoBelt.position.set(0, 1.18, 0);
    ammoBelt.rotation.z = 0.55;
    this.root.add(ammoBelt);

    this.headGroup = new THREE.Group();
    this.headGroup.position.set(0, 1.82, 0);
    const headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.44, 0.42), skinMat);
    this.headGroup.add(headMesh);

    const eyeMat = new THREE.MeshBasicMaterial({ color: spec.headgear === 'visor' ? 0x00e5ff : 0x111111 });
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.08, 0.06), eyeMat);
    brow.position.set(0, 0.05, -0.21);
    this.headGroup.add(brow);

    const capMat = new THREE.MeshStandardMaterial({ color: spec.vestColor, roughness: 0.35 });
    const helmet = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.2, 12), capMat);
    helmet.position.y = 0.22;
    this.headGroup.add(helmet);

    if (spec.headgear === 'cap') {
      const visor = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.04, 0.22), capMat);
      visor.position.set(0, 0.15, -0.24);
      this.headGroup.add(visor);
    }
    this.root.add(this.headGroup);

    this.leftArm = new THREE.Group();
    this.leftArm.position.set(-0.46, 1.42, 0);
    const lUpper = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.58, 0.22), skinMat);
    lUpper.position.y = -0.22;
    const lGlove = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.2, 0.24), bootMat);
    lGlove.position.y = -0.52;
    this.leftArm.add(lUpper, lGlove);
    this.root.add(this.leftArm);

    this.rightArm = new THREE.Group();
    this.rightArm.position.set(0.46, 1.42, 0);
    const rUpper = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.58, 0.22), skinMat);
    rUpper.position.y = -0.22;
    const rGlove = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.2, 0.24), bootMat);
    rGlove.position.y = -0.52;
    this.rightArm.add(rUpper, rGlove);

    this.weaponSocket = new THREE.Group();
    this.weaponSocket.position.set(0, -0.45, -0.35);
    const weaponMesh = buildWeaponMesh(weaponId, weaponTier);
    this.weaponSocket.add(weaponMesh);
    this.rightArm.add(this.weaponSocket);
    this.root.add(this.rightArm);

    this.leftLeg = new THREE.Group();
    this.leftLeg.position.set(-0.19, 0.72, 0);
    const lThigh = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.52, 0.26), pantsMat);
    lThigh.position.y = -0.24;
    const lBoot = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.24, 0.34), bootMat);
    lBoot.position.set(0, -0.58, -0.04);
    this.leftLeg.add(lThigh, lBoot);
    this.root.add(this.leftLeg);

    this.rightLeg = new THREE.Group();
    this.rightLeg.position.set(0.19, 0.72, 0);
    const rThigh = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.52, 0.26), pantsMat);
    rThigh.position.y = -0.24;
    const rBoot = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.24, 0.34), bootMat);
    rBoot.position.set(0, -0.58, -0.04);
    this.rightLeg.add(rThigh, rBoot);
    this.root.add(this.rightLeg);
  }

  triggerRecoil() {
    this.recoilOffset = 0.16;
  }

  triggerUpgradePulse() {
    this.upgradePulse = 1.0;
  }

  jump() {
    if (!this.isJumping) {
      this.isJumping = true;
      this.vy = 9.5;
    }
  }

  update(dt, state = 'run') {
    this.animState = state;
    this.animTime += dt * (state === 'run' ? 11.5 : 3.5);

    if (this.isJumping) {
      this.y += this.vy * dt;
      this.vy -= 26.0 * dt;
      if (this.y <= 0) {
        this.y = 0;
        this.vy = 0;
        this.isJumping = false;
      }
    }

    if (this.recoilOffset > 0) {
      this.recoilOffset = Math.max(0, this.recoilOffset - dt * 1.4);
    }

    if (this.upgradePulse > 0) {
      this.upgradePulse = Math.max(0, this.upgradePulse - dt * 2.2);
      const s = 1 + Math.sin(this.upgradePulse * Math.PI) * 0.25;
      this.root.scale.set(s, s, s);
    } else {
      this.root.scale.set(1, 1, 1);
    }

    if (state === 'run') {
      const swing = Math.sin(this.animTime) * 0.62;
      this.leftLeg.rotation.x = swing;
      this.rightLeg.rotation.x = -swing;
      this.leftArm.rotation.x = 0.45 - swing * 0.25;
      this.rightArm.rotation.x = 0.65 + this.recoilOffset;
      this.headGroup.position.y = 1.82 + Math.abs(Math.cos(this.animTime)) * 0.04;
    } else if (state === 'victory') {
      this.leftArm.rotation.x = Math.PI * 0.85 + Math.sin(this.animTime * 2) * 0.2;
      this.rightArm.rotation.x = Math.PI * 0.85 - Math.sin(this.animTime * 2) * 0.2;
      this.leftLeg.rotation.x = 0;
      this.rightLeg.rotation.x = 0;
    } else if (state === 'defeat') {
      this.root.rotation.x = -Math.PI / 2.2;
    } else {
      this.root.rotation.x = 0;
      this.leftLeg.rotation.x = 0;
      this.rightLeg.rotation.x = 0;
      this.leftArm.rotation.x = 0.35 + Math.sin(this.animTime) * 0.05;
      this.rightArm.rotation.x = 0.55 + Math.cos(this.animTime) * 0.05;
    }

    if (this.weaponSocket) {
      this.weaponSocket.position.z = -0.35 + this.recoilOffset * 0.7;
    }

    this.root.position.set(this.x, this.y, this.z);
  }
}
</script>

<script type="text/plain" data-path="js/squad.js">
import * as THREE from 'three';

const MAX_RENDERED_INSTANCES = 160;

export class SquadSystem {
  constructor(scene, upgrades) {
    this.scene = scene;
    this.upgrades = upgrades;
    this.logicalCount = 3;
    this.soldiers = [];
    this.formationType = 'double_line';

    this.dummy = new THREE.Object3D();
    this.initInstancedMeshes();
  }

  initInstancedMeshes() {
    const vestMat = new THREE.MeshStandardMaterial({ color: 0x1a73e8, roughness: 0.45 });
    const headMat = new THREE.MeshStandardMaterial({ color: 0xd7a17c, roughness: 0.6 });
    const helmetMat = new THREE.MeshStandardMaterial({ color: 0x174ea6, roughness: 0.35 });
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x263238, metalness: 0.6, roughness: 0.3 });

    this.torsoInst = new THREE.InstancedMesh(new THREE.BoxGeometry(0.46, 0.62, 0.3), vestMat, MAX_RENDERED_INSTANCES);
    this.headInst = new THREE.InstancedMesh(new THREE.BoxGeometry(0.32, 0.32, 0.32), headMat, MAX_RENDERED_INSTANCES);
    this.helmetInst = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.2, 0.2, 0.15, 8), helmetMat, MAX_RENDERED_INSTANCES);
    this.gunInst = new THREE.InstancedMesh(new THREE.BoxGeometry(0.12, 0.14, 0.52), gunMat, MAX_RENDERED_INSTANCES);

    this.torsoInst.castShadow = true;
    this.scene.add(this.torsoInst, this.headInst, this.helmetInst, this.gunInst);
  }

  reset(initialCount, startX = 0, startZ = 0) {
    this.logicalCount = Math.max(1, initialCount);
    this.soldiers = [];
    const visibleTarget = Math.min(MAX_RENDERED_INSTANCES, Math.max(0, this.logicalCount - 1));
    for (let i = 0; i < visibleTarget; i++) {
      this.soldiers.push({
        x: startX,
        z: startZ + 1.2,
        offsetX: 0,
        offsetZ: 1.2,
        phase: Math.random() * Math.PI * 2,
        hp: this.upgrades.getSoldierHealth()
      });
    }
    this.selectOptimalFormation();
    this.recomputeFormationOffsets();
  }

  selectOptimalFormation() {
    if (this.logicalCount <= 4) this.formationType = 'single_line';
    else if (this.logicalCount <= 10) this.formationType = 'double_line';
    else if (this.logicalCount <= 22) this.formationType = 'v_formation';
    else if (this.logicalCount <= 45) this.formationType = 'triple_line';
    else this.formationType = 'wide_battle';
  }

  recomputeFormationOffsets() {
    this.selectOptimalFormation();
    const n = this.soldiers.length;

    for (let i = 0; i < n; i++) {
      const s = this.soldiers[i];
      if (this.formationType === 'single_line') {
        const side = (i % 2 === 0 ? 1 : -1) * Math.ceil((i + 1) / 2);
        s.offsetX = side * 0.72;
        s.offsetZ = 0.6;
      } else if (this.formationType === 'double_line') {
        const row = Math.floor(i / 5);
        const col = (i % 5) - 2;
        s.offsetX = col * 0.72;
        s.offsetZ = 0.85 + row * 0.82;
      } else if (this.formationType === 'v_formation') {
        const wing = i % 2 === 0 ? 1 : -1;
        const rank = Math.floor(i / 2) + 1;
        s.offsetX = wing * (rank * 0.42);
        s.offsetZ = 0.6 + rank * 0.52;
      } else if (this.formationType === 'triple_line') {
        const cols = 7;
        const row = Math.floor(i / cols);
        const col = (i % cols) - Math.floor(cols / 2);
        s.offsetX = col * 0.68;
        s.offsetZ = 0.8 + row * 0.76;
      } else {
        const cols = 10;
        const row = Math.floor(i / cols);
        const col = (i % cols) - (cols - 1) / 2;
        s.offsetX = col * 0.58;
        s.offsetZ = 0.85 + row * 0.68;
      }
    }
  }

  applySquadDelta(newCount, commanderX, commanderZ) {
    const cap = this.upgrades.getMaxSquadCapacity();
    this.logicalCount = Math.max(0, Math.min(cap, Math.floor(newCount)));

    const visibleTarget = Math.min(MAX_RENDERED_INSTANCES, Math.max(0, this.logicalCount - 1));
    while (this.soldiers.length < visibleTarget) {
      this.soldiers.push({
        x: commanderX + (Math.random() - 0.5) * 1.5,
        z: commanderZ + 1.0 + Math.random() * 1.5,
        offsetX: 0,
        offsetZ: 1.0,
        phase: Math.random() * Math.PI * 2,
        hp: this.upgrades.getSoldierHealth()
      });
    }
    if (this.soldiers.length > visibleTarget) {
      this.soldiers.length = visibleTarget;
    }
    this.recomputeFormationOffsets();
  }

  removeCasualties(count, commanderX, commanderZ) {
    this.applySquadDelta(this.logicalCount - count, commanderX, commanderZ);
  }

  update(dt, commanderX, commanderY, commanderZ, isRunning = true) {
    const activeInstances = this.soldiers.length;
    this.torsoInst.count = activeInstances;
    this.headInst.count = activeInstances;
    this.helmetInst.count = activeInstances;
    this.gunInst.count = activeInstances;

    const lerpFactor = Math.min(1, dt * 10.5);

    for (let i = 0; i < activeInstances; i++) {
      const s = this.soldiers[i];
      s.phase += dt * (isRunning ? 12.0 : 3.0);

      const targetX = THREE.MathUtils.clamp(commanderX + s.offsetX, -5.4, 5.4);
      const targetZ = commanderZ + s.offsetZ;

      s.x += (targetX - s.x) * lerpFactor;
      s.z += (targetZ - s.z) * lerpFactor;

      const bob = isRunning ? Math.abs(Math.sin(s.phase)) * 0.14 : 0;
      const baseY = commanderY + bob;

      this.dummy.position.set(s.x, baseY + 0.72, s.z);
      this.dummy.rotation.set(0, 0, isRunning ? Math.sin(s.phase) * 0.06 : 0);
      this.dummy.scale.set(1, 1, 1);
      this.dummy.updateMatrix();
      this.torsoInst.setMatrixAt(i, this.dummy.matrix);

      this.dummy.position.set(s.x, baseY + 1.22, s.z);
      this.dummy.rotation.set(0, 0, 0);
      this.dummy.updateMatrix();
      this.headInst.setMatrixAt(i, this.dummy.matrix);

      this.dummy.position.set(s.x, baseY + 1.41, s.z);
      this.dummy.updateMatrix();
      this.helmetInst.setMatrixAt(i, this.dummy.matrix);

      this.dummy.position.set(s.x + 0.22, baseY + 0.78, s.z - 0.28);
      this.dummy.updateMatrix();
      this.gunInst.setMatrixAt(i, this.dummy.matrix);
    }

    this.torsoInst.instanceMatrix.needsUpdate = true;
    this.headInst.instanceMatrix.needsUpdate = true;
    this.helmetInst.instanceMatrix.needsUpdate = true;
    this.gunInst.instanceMatrix.needsUpdate = true;
  }

  getShooterPositions(commanderX, commanderY, commanderZ, maxShooters = 28) {
    const out = [{ x: commanderX, y: commanderY + 1.0, z: commanderZ - 0.5, isCommander: true }];
    const step = Math.max(1, Math.floor(this.soldiers.length / maxShooters));
    for (let i = 0; i < this.soldiers.length && out.length < maxShooters; i += step) {
      const s = this.soldiers[i];
      out.push({ x: s.x, y: commanderY + 0.85, z: s.z - 0.3, isCommander: false });
    }
    return out;
  }
}
</script>

import * as THREE from 'three';

export const ENEMY_ARCHETYPES = {
  standard: { name: 'Standard Soldier', category: 'normal', scale: 1.0, hp: 28, speed: 5.5, color: 0xd93025, coin: 4 },
  heavy_armor: { name: 'Heavy Armored Soldier', category: 'normal', scale: 1.18, hp: 65, speed: 4.2, color: 0x8c1d18, coin: 8 },
  shield: { name: 'Shield Soldier', category: 'normal', scale: 1.1, hp: 85, speed: 4.0, color: 0x5f6368, coin: 9, hasShield: true },
  fast_attacker: { name: 'Fast Attacking Enemy', category: 'normal', scale: 0.92, hp: 22, speed: 8.8, color: 0xfa903e, coin: 6 },
  rifle: { name: 'Rifle Enemy', category: 'normal', scale: 1.0, hp: 36, speed: 5.0, color: 0xc5221f, coin: 7, ranged: true },
  hmg_enemy: { name: 'Heavy MG Enemy', category: 'normal', scale: 1.15, hp: 58, speed: 4.5, color: 0x9c27b0, coin: 10, ranged: true },

  giant_mutant: { name: 'Giant Mutant', category: 'special', scale: 1.65, hp: 180, speed: 4.6, color: 0x4caf50, coin: 22 },
  armored_brute: { name: 'Armored Brute', category: 'special', scale: 1.55, hp: 230, speed: 3.8, color: 0x37474f, coin: 26 },
  fire_warrior: { name: 'Fire Warrior', category: 'special', scale: 1.28, hp: 125, speed: 6.2, color: 0xff5722, coin: 18 },
  electric_warrior: { name: 'Electric Warrior', category: 'special', scale: 1.28, hp: 130, speed: 6.8, color: 0x00e5ff, coin: 20 },
  explosive_enemy: { name: 'Explosive Enemy', category: 'special', scale: 1.15, hp: 70, speed: 7.8, color: 0xffeb3b, coin: 16, explosive: true },
  elite_commander: { name: 'Elite Enemy Commander', category: 'special', scale: 1.4, hp: 195, speed: 5.4, color: 0xf538a0, coin: 30 }
};

export class EnemyManager {
  constructor(scene) {
    this.scene = scene;
    this.enemies = [];
  }

  clearAll() {
    for (const e of this.enemies) {
      this.scene.remove(e.mesh);
    }
    this.enemies = [];
  }

  spawnWave(waveSpec, difficultyMult) {
    for (const unit of waveSpec.units) {
      const arch = ENEMY_ARCHETYPES[unit.type] || ENEMY_ARCHETYPES.standard;
      const mesh = this.createEnemyMesh(arch);
      mesh.position.set(unit.x, 0, unit.z);
      this.scene.add(mesh);

      const maxHp = Math.round(arch.hp * difficultyMult.hp);
      this.enemies.push({
        type: unit.type,
        arch,
        mesh,
        x: unit.x,
        y: 0,
        z: unit.z,
        hp: maxHp,
        maxHp,
        speed: arch.speed * difficultyMult.speed,
        phase: Math.random() * Math.PI * 2,
        hitFlash: 0,
        dead: false,
        deathTimer: 0
      });
    }
  }

  createEnemyMesh(arch) {
    const group = new THREE.Group();
    const s = arch.scale;

    const bodyMat = new THREE.MeshStandardMaterial({ color: arch.color, roughness: 0.45 });
    const headMat = new THREE.MeshStandardMaterial({ color: 0x2b1d1d, roughness: 0.6 });

    const body = new THREE.Mesh(new THREE.BoxGeometry(0.52 * s, 0.75 * s, 0.36 * s), bodyMat);
    body.position.y = 0.68 * s;
    body.castShadow = true;
    group.add(body);

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.36 * s, 0.36 * s, 0.36 * s), headMat);
    head.position.y = 1.28 * s;
    group.add(head);

    if (arch.hasShield) {
      const shield = new THREE.Mesh(
        new THREE.BoxGeometry(0.68 * s, 0.9 * s, 0.1 * s),
        new THREE.MeshStandardMaterial({ color: 0x90a4ae, metalness: 0.7, roughness: 0.2 })
      );
      shield.position.set(0, 0.72 * s, 0.26 * s);
      group.add(shield);
    }

    group.userData.bodyMat = bodyMat;
    group.userData.baseColor = arch.color;
    return group;
  }

  update(dt, playerZ, playerX, onSquadCollide, onEnemyDefeated) {
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];

      if (e.dead) {
        e.deathTimer += dt * 4.0;
        e.mesh.rotation.x = -e.deathTimer * 1.4;
        e.mesh.position.y = Math.max(-0.5, -e.deathTimer * 0.4);
        if (e.deathTimer >= 1.0) {
          this.scene.remove(e.mesh);
          this.enemies.splice(i, 1);
        }
        continue;
      }

      if (e.hitFlash > 0) {
        e.hitFlash -= dt;
        e.mesh.userData.bodyMat.emissive.setHex(e.hitFlash > 0 ? 0x661111 : 0x000000);
      }

      const distZ = playerZ - e.z;
      if (distZ < 95 && distZ > -10) {
        e.phase += dt * 10.0;
        e.z += e.speed * dt;
        const steer = THREE.MathUtils.clamp(playerX - e.x, -1, 1);
        e.x += steer * 1.4 * dt;

        e.mesh.position.set(e.x, Math.abs(Math.sin(e.phase)) * 0.12, e.z);

        if (Math.abs(e.z - playerZ) < 1.35 && Math.abs(e.x - playerX) < 3.4) {
          const penalty = e.arch.category === 'special' ? 4 : 1;
          onSquadCollide(penalty, e);
          e.dead = true;
        }
      } else if (e.z > playerZ + 12) {
        this.scene.remove(e.mesh);
        this.enemies.splice(i, 1);
      }
    }
  }

  damageEnemy(enemy, dmg, onEnemyDefeated) {
    if (enemy.dead) return false;
    enemy.hp -= dmg;
    enemy.hitFlash = 0.08;
    if (enemy.hp <= 0) {
      enemy.dead = true;
      onEnemyDefeated(enemy);
      return true;
    }
    return false;
  }

  getActiveCount() {
    let count = 0;
    for (const e of this.enemies) {
      if (!e.dead) count++;
    }
    return count;
  }
}
</script>

<script type="text/plain" data-path="js/boss.js">
import * as THREE from 'three';

export const BOSS_ARCHETYPES = [
  { id: 'giant_war_beast', name: 'Giant War Beast', color: 0xb71c1c, accent: 0xff8a65, baseHp: 950, scale: 2.6 },
  { id: 'heavy_armored_boss', name: 'Heavy Armored Boss', color: 0x37474f, accent: 0xfcc934, baseHp: 1250, scale: 2.7 },
  { id: 'cybernetic_monster', name: 'Cybernetic Monster', color: 0x311b92, accent: 0x00e5ff, baseHp: 1550, scale: 2.85 },
  { id: 'mega_soldier', name: 'Mega Soldier', color: 0x1b5e20, accent: 0x76ff03, baseHp: 1850, scale: 2.95 },
  { id: 'ultimate_war_commander', name: 'Ultimate War Commander', color: 0x212121, accent: 0xf538a0, baseHp: 2300, scale: 3.1 }
];

export class BossManager {
  constructor(scene) {
    this.scene = scene;
    this.activeBoss = null;
  }

  clear() {
    if (this.activeBoss) {
      this.scene.remove(this.activeBoss.mesh);
      this.activeBoss = null;
    }
  }

  spawnBoss(bossSpec, zPos, difficultyMult) {
    this.clear();
    const arch = BOSS_ARCHETYPES.find(b => b.id === bossSpec.id) || BOSS_ARCHETYPES[0];
    const group = new THREE.Group();
    const s = arch.scale;

    const armorMat = new THREE.MeshStandardMaterial({ color: arch.color, metalness: 0.5, roughness: 0.35 });
    const coreMat = new THREE.MeshStandardMaterial({ color: arch.accent, emissive: arch.accent, emissiveIntensity: 0.4 });

    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.95 * s, 1.2 * s, 0.65 * s), armorMat);
    torso.position.y = 1.1 * s;
    torso.castShadow = true;
    group.add(torso);

    const core = new THREE.Mesh(new THREE.SphereGeometry(0.24 * s, 12, 12), coreMat);
    core.position.set(0, 1.15 * s, 0.34 * s);
    group.add(core);

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.55 * s, 0.55 * s, 0.55 * s), armorMat);
    head.position.y = 2.0 * s;
    group.add(head);

    const lShoulder = new THREE.Mesh(new THREE.BoxGeometry(0.45 * s, 0.85 * s, 0.45 * s), armorMat);
    lShoulder.position.set(-0.78 * s, 1.15 * s, 0);
    const rShoulder = lShoulder.clone();
    rShoulder.position.x = 0.78 * s;
    group.add(lShoulder, rShoulder);

    group.position.set(0, 0, zPos);
    group.userData.armorMat = armorMat;
    this.scene.add(group);

    const maxHp = Math.round(arch.baseHp * difficultyMult.bossHp);
    this.activeBoss = {
      arch,
      mesh: group,
      x: 0,
      y: 0,
      z: zPos,
      hp: maxHp,
      maxHp,
      phase: 1,
      maxPhases: bossSpec.phases || 3,
      attackTimer: 3.2,
      engaged: false,
      dead: false
    };
    return this.activeBoss;
  }

  update(dt, playerZ, playerX, onBossSpecialAttack, onBossCollide) {
    const b = this.activeBoss;
    if (!b || b.dead) return;

    const dist = playerZ - b.z;
    if (dist < 62 && !b.engaged) {
      b.engaged = true;
    }

    if (b.engaged) {
      const hpRatio = b.hp / b.maxHp;
      if (hpRatio < 0.34) b.phase = b.maxPhases;
      else if (hpRatio < 0.67) b.phase = Math.min(b.maxPhases, 2);
      else b.phase = 1;

      const phaseSpeed = 2.4 + b.phase * 0.75;
      b.z += phaseSpeed * dt;
      b.x = Math.sin(performance.now() * 0.002 * b.phase) * 2.8;
      b.mesh.position.set(b.x, 0, b.z);

      b.attackTimer -= dt;
      if (b.attackTimer <= 0) {
        b.attackTimer = Math.max(1.8, 3.8 - b.phase * 0.55);
        onBossSpecialAttack(b);
      }

      if (Math.abs(b.z - playerZ) < 2.3) {
        onBossCollide(b);
      }
    }
  }

  damageBoss(dmg, onBossDefeated) {
    const b = this.activeBoss;
    if (!b || b.dead) return false;
    b.hp = Math.max(0, b.hp - dmg);
    if (b.hp <= 0) {
      b.dead = true;
      this.scene.remove(b.mesh);
      onBossDefeated(b);
      this.activeBoss = null;
      return true;
    }
    return false;
  }
}
</script>

<script type="text/plain" data-path="js/gates.js">
import * as THREE from 'three';

export class GateAndPowerupManager {
  constructor(scene) {
    this.scene = scene;
    this.gates = [];
    this.powerups = [];
    this.obstacles = [];
  }

  clearAll() {
    for (const g of this.gates) this.scene.remove(g.mesh);
    for (const p of this.powerups) this.scene.remove(p.mesh);
    for (const o of this.obstacles) this.scene.remove(o.mesh);
    this.gates = [];
    this.powerups = [];
    this.obstacles = [];
  }

  createGateTexture(label, isPositive, isSpecial) {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');

    if (isSpecial) {
      ctx.fillStyle = 'rgba(245, 56, 160, 0.78)';
    } else if (isPositive) {
      ctx.fillStyle = 'rgba(26, 115, 232, 0.78)';
    } else {
      ctx.fillStyle = 'rgba(217, 48, 37, 0.78)';
    }
    ctx.fillRect(0, 0, 256, 256);

    ctx.strokeStyle = isSpecial ? '#fcc934' : (isPositive ? '#00e5ff' : '#ff8a80');
    ctx.lineWidth = 12;
    ctx.strokeRect(6, 6, 244, 244);

    ctx.fillStyle = '#ffffff';
    ctx.font = '900 54px Segoe UI, Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, 128, 128);

    const tex = new THREE.CanvasTexture(canvas);
    tex.needsUpdate = true;
    return tex;
  }

  spawnGatePair(pairSpec) {
    for (const g of pairSpec.gates) {
      const group = new THREE.Group();
      const tex = this.createGateTexture(g.label, g.isPositive, g.isSpecial);

      const panelMat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        opacity: 0.9,
        side: THREE.DoubleSide
      });
      const panel = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 3.2), panelMat);
      panel.position.y = 1.65;
      group.add(panel);

      const postMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, metalness: 0.7, roughness: 0.2 });
      const lPost = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3.4, 8), postMat);
      lPost.position.set(-2.3, 1.7, 0);
      const rPost = lPost.clone();
      rPost.position.x = 2.3;
      group.add(lPost, rPost);

      group.position.set(g.x, 0, pairSpec.z);
      this.scene.add(group);

      this.gates.push({
        ...g,
        z: pairSpec.z,
        pairId: pairSpec.pairId,
        mesh: group,
        panelMat,
        triggered: false
      });
    }
  }

  spawnPowerups(list) {
    for (const p of list) {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({
        color: p.color,
        emissive: p.color,
        emissiveIntensity: 0.5,
        metalness: 0.6,
        roughness: 0.2
      });
      const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.65, 0), mat);
      core.position.y = 1.2;
      group.add(core);

      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.85, 0.08, 8, 20),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      ring.position.y = 1.2;
      group.add(ring);

      group.position.set(p.x, 0, p.z);
      this.scene.add(group);

      this.powerups.push({
        ...p,
        mesh: group,
        collected: false
      });
    }
  }

  spawnObstacles(list) {
    for (const o of list) {
      const mat = new THREE.MeshStandardMaterial({ color: 0xff5252, metalness: 0.5, roughness: 0.4 });
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 1.5, 12), mat);
      mesh.position.set(o.x, 0.75, o.z);
      this.scene.add(mesh);

      this.obstacles.push({
        ...o,
        mesh,
        triggered: false
      });
    }
  }

  hitGateWithBullet(gate) {
    if (gate.triggered || gate.isSpecial) return;
    if (gate.op === 'add') {
      gate.value += 1;
      if (gate.value >= 0) {
        gate.isPositive = true;
        gate.label = `+${gate.value}`;
      } else {
        gate.isPositive = false;
        gate.label = `${gate.value}`;
      }
      gate.panelMat.map.dispose();
      gate.panelMat.map = this.createGateTexture(gate.label, gate.isPositive, false);
    }
  }

  update(dt, playerX, playerZ, onGateTrigger, onPowerupCollect, onObstacleHit) {
    const t = performance.now() * 0.003;

    for (const g of this.gates) {
      if (g.triggered) continue;
      if (Math.abs(playerZ - g.z) < 1.15 && Math.abs(playerX - g.x) < 2.45) {
        for (const sibling of this.gates) {
          if (sibling.pairId === g.pairId) {
            sibling.triggered = true;
            this.scene.remove(sibling.mesh);
          }
        }
        onGateTrigger(g);
      }
    }

    for (const p of this.powerups) {
      if (p.collected) continue;
      p.mesh.rotation.y = t;
      p.mesh.position.y = Math.sin(t * 1.5) * 0.2;
      if (Math.abs(playerZ - p.z) < 1.4 && Math.abs(playerX - p.x) < 1.8) {
        p.collected = true;
        this.scene.remove(p.mesh);
        onPowerupCollect(p);
      }
    }

    for (const o of this.obstacles) {
      if (o.triggered) continue;
      o.mesh.rotation.y = -t * 2;
      if (Math.abs(playerZ - o.z) < 1.2 && Math.abs(playerX - o.x) < 1.65) {
        o.triggered = true;
        this.scene.remove(o.mesh);
        onObstacleHit(o);
      }
    }
  }
}
</script>

<script type="text/plain" data-path="js/shooting.js">
import * as THREE from 'three';

const MAX_BULLETS = 220;

export class ShootingSystem {
  constructor(scene) {
    this.scene = scene;
    this.dummy = new THREE.Object3D();
    this.bullets = [];

    const geo = new THREE.SphereGeometry(0.14, 6, 6);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    this.instMesh = new THREE.InstancedMesh(geo, mat, MAX_BULLETS);
    this.scene.add(this.instMesh);

    for (let i = 0; i < MAX_BULLETS; i++) {
      this.bullets.push({
        active: false,
        x: 0,
        y: -100,
        z: 0,
        vx: 0,
        vz: 0,
        damage: 10,
        splash: 0,
        life: 0,
        color: new THREE.Color(0xfcc934)
      });
    }
  }

  clearAll() {
    for (const b of this.bullets) {
      b.active = false;
    }
    this.instMesh.count = 0;
  }

  spawnBullet(x, y, z, vx, vz, damage, colorHex, splash = 0) {
    for (let i = 0; i < MAX_BULLETS; i++) {
      const b = this.bullets[i];
      if (!b.active) {
        b.active = true;
        b.x = x;
        b.y = y;
        b.z = z;
        b.vx = vx;
        b.vz = vz;
        b.damage = damage;
        b.splash = splash;
        b.life = 1.35;
        b.color.setHex(colorHex);
        this.instMesh.setColorAt(i, b.color);
        if (this.instMesh.instanceColor) {
          this.instMesh.instanceColor.needsUpdate = true;
        }
        return;
      }
    }
  }

  fireSquadVolley(shooters, weaponSpec, damageMult, enemies) {
    for (const shooter of shooters) {
      let aimAngle = 0;
      let bestDist = 65;
      for (const e of enemies) {
        if (e.dead || e.z > shooter.z) continue;
        const dz = shooter.z - e.z;
        if (dz < bestDist) {
          bestDist = dz;
          aimAngle = Math.atan2(e.x - shooter.x, -dz) * 0.45;
        }
      }

      const pellets = shooter.isCommander ? weaponSpec.effectivePellets : 1;
      const dmg = weaponSpec.effectiveDamage * damageMult * (shooter.isCommander ? 1.25 : 0.45);

      for (let p = 0; p < pellets; p++) {
        const spreadOffset = (Math.random() - 0.5) * weaponSpec.spread;
        const angle = aimAngle + spreadOffset;
        const vx = Math.sin(angle) * weaponSpec.bulletSpeed;
        const vz = -Math.cos(angle) * weaponSpec.bulletSpeed;
        this.spawnBullet(
          shooter.x,
          shooter.y,
          shooter.z,
          vx,
          vz,
          dmg,
          weaponSpec.projColor,
          weaponSpec.splashRadius || 0
        );
      }
    }
  }

  update(dt, enemyManager, bossManager, gateManager, effects, onEnemyKill, onBossKill) {
    this.instMesh.count = MAX_BULLETS;

    for (let i = 0; i < MAX_BULLETS; i++) {
      const b = this.bullets[i];
      if (!b.active) {
        this.dummy.position.set(0, -200, 0);
        this.dummy.scale.set(0, 0, 0);
        this.dummy.updateMatrix();
        this.instMesh.setMatrixAt(i, this.dummy.matrix);
        continue;
      }

      b.x += b.vx * dt;
      b.z += b.vz * dt;
      b.life -= dt;

      if (b.life <= 0) {
        b.active = false;
        continue;
      }

      for (const g of gateManager.gates) {
        if (!g.triggered && Math.abs(b.z - g.z) < 0.7 && Math.abs(b.x - g.x) < 2.2) {
          gateManager.hitGateWithBullet(g);
          b.active = false;
          effects.spawnHitSpark(b.x, b.y, b.z, 0x00e5ff);
          break;
        }
      }
      if (!b.active) continue;

      for (const e of enemyManager.enemies) {
        if (e.dead) continue;
        if (Math.abs(b.z - e.z) < 0.85 && Math.abs(b.x - e.x) < 0.75 * e.arch.scale) {
          b.active = false;
          effects.spawnHitSpark(b.x, b.y, b.z, 0xffeb3b);
          enemyManager.damageEnemy(e, b.damage, onEnemyKill);

          if (b.splash > 0) {
            effects.spawnExplosion(b.x, b.y, b.z, 0xff5722);
            for (const other of enemyManager.enemies) {
              if (!other.dead && other !== e) {
                const d = Math.hypot(other.x - b.x, other.z - b.z);
                if (d <= b.splash) {
                  enemyManager.damageEnemy(other, b.damage * 0.65, onEnemyKill);
                }
              }
            }
          }
          break;
        }
      }
      if (!b.active) continue;

      const boss = bossManager.activeBoss;
      if (boss && !boss.dead) {
        if (Math.abs(b.z - boss.z) < 1.8 && Math.abs(b.x - boss.x) < 1.8) {
          b.active = false;
          effects.spawnHitSpark(b.x, b.y, b.z, 0xff5252);
          bossManager.damageBoss(b.damage, onBossKill);
        }
      }

      this.dummy.position.set(b.x, b.y, b.z);
      this.dummy.scale.set(1, 1, 2.2);
      this.dummy.updateMatrix();
      this.instMesh.setMatrixAt(i, this.dummy.matrix);
    }

    this.instMesh.instanceMatrix.needsUpdate = true;
  }
}
</script>

<script type="text/plain" data-path="js/generator.js">
import { BOSS_ARCHETYPES } from './boss.js';

export class LevelGenerator {
  createSeededRandom(seed) {
    let a = seed >>> 0;
    return function () {
      let t = (a += 0x6d2b79f5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  getDifficultyParameters(level) {
    const L = Math.max(1, level);
    const hpMult = 1 + 0.18 * (L - 1) + 0.015 * Math.pow(L - 1, 1.35);
    const dmgMult = 1 + 0.08 * Math.pow(L - 1, 0.95);
    const speedMult = Math.min(2.1, 1 + 0.12 * Math.log(L + 1));
    const bridgeLength = Math.min(680, Math.round(220 + 28 * Math.log(L + 1) + 2.5 * Math.min(L, 120)));

    let posBias = 0.5;
    if (L <= 10) posBias = 0.78;
    else if (L <= 25) posBias = 0.70;
    else if (L <= 50) posBias = 0.64;
    else if (L <= 100) posBias = 0.58;
    else if (L <= 250) posBias = 0.54;
    else if (L <= 500) posBias = 0.52;

    return {
      hp: hpMult,
      dmg: dmgMult,
      speed: speedMult,
      bossHp: hpMult * 1.15,
      bridgeLength,
      posBias
    };
  }

  generateLevel(levelNum, mode = 'campaign', startingSquad = 3) {
    const rng = this.createSeededRandom(levelNum * 9973 + mode.length * 313);
    const diff = this.getDifficultyParameters(levelNum);
    const envIndex = ((levelNum - 1) % 10) + 1;

    const gatePairs = [];
    const enemyWaves = [];
    const powerups = [];
    const obstacles = [];

    let virtualSquad = startingSquad;
    const segmentStep = 34;
    let pairCounter = 1;

    for (let z = -32; z > -diff.bridgeLength + 45; z -= segmentStep) {
      const g1Pos = rng() < diff.posBias;
      let g2Pos = rng() < diff.posBias;
      if (!g1Pos && !g2Pos && virtualSquad < 14) {
        g2Pos = true;
      }

      const leftGate = this.buildSingleGate(-2.45, g1Pos, rng, levelNum);
      const rightGate = this.buildSingleGate(2.45, g2Pos, rng, levelNum);

      virtualSquad = Math.max(4, this.simulateGateChoice(virtualSquad, leftGate, rightGate));

      gatePairs.push({
        pairId: pairCounter++,
        z,
        gates: [leftGate, rightGate]
      });

      const midZ = z - 14;
      if (rng() < 0.48) {
        powerups.push(this.buildPowerup((rng() - 0.5) * 7.5, midZ, rng));
      }
      if (levelNum >= 4 && rng() < 0.35 && mode !== 'army_challenge') {
        obstacles.push({
          x: (rng() - 0.5) * 7.0,
          z: midZ - 3
        });
      }

      if (mode !== 'boss_battle') {
        const waveZ = z - 22;
        enemyWaves.push(this.buildEnemyWave(waveZ, levelNum, virtualSquad, rng));
      }
    }

    const bossIndex = (levelNum - 1) % BOSS_ARCHETYPES.length;
    const bossPhases = levelNum <= 10 ? 2 : (levelNum <= 250 ? 3 : 4);
    const bossSpec = {
      id: BOSS_ARCHETYPES[bossIndex].id,
      phases: bossPhases,
      z: -diff.bridgeLength + 18
    };

    return {
      levelNum,
      mode,
      envIndex,
      diff,
      gatePairs,
      enemyWaves,
      powerups,
      obstacles,
      bossSpec
    };
  }

  buildSingleGate(x, isPositive, rng, levelNum) {
    if (isPositive && rng() < 0.16) {
      const specials = [
        { op: 'add', value: 50, label: '+50 SOLDIERS', isPositive: true, isSpecial: true },
        { op: 'weapon_up', value: 1, label: 'WEAPON UP', isPositive: true, isSpecial: true },
        { op: 'double_dmg', value: 8, label: '2X DAMAGE', isPositive: true, isSpecial: true },
        { op: 'rapid_fire', value: 8, label: 'RAPID FIRE', isPositive: true, isSpecial: true },
        { op: 'shield', value: 8, label: 'SHIELD', isPositive: true, isSpecial: true }
      ];
      const pick = specials[Math.floor(rng() * specials.length)];
      return { x, ...pick };
    }

    if (isPositive) {
      if (rng() < 0.28) {
        const mults = [2, 2, 3, 5];
        const m = mults[Math.floor(rng() * (levelNum > 15 ? 4 : 3))];
        return { x, op: 'mul', value: m, label: `×${m}`, isPositive: true, isSpecial: false };
      }
      const adds = [2, 3, 5, 10, 20];
      const a = adds[Math.floor(rng() * adds.length)];
      return { x, op: 'add', value: a, label: `+${a}`, isPositive: true, isSpecial: false };
    } else {
      if (rng() < 0.25) {
        return { x, op: 'div', value: 2, label: '÷2', isPositive: false, isSpecial: false };
      }
      const subs = [-2, -3, -5, -10];
      const s = subs[Math.floor(rng() * subs.length)];
      return { x, op: 'add', value: s, label: `${s}`, isPositive: false, isSpecial: false };
    }
  }

  simulateGateChoice(current, g1, g2) {
    const evalGate = (c, g) => {
      if (g.op === 'add') return c + g.value;
      if (g.op === 'mul') return c * g.value;
      if (g.op === 'div') return Math.floor(c / g.value);
      return c;
    };
    return Math.max(evalGate(current, g1), evalGate(current, g2));
  }

  buildPowerup(x, z, rng) {
    const list = [
      { type: 'double_damage', name: 'Double Damage', color: 0xff5252, duration: 8 },
      { type: 'rapid_fire', name: 'Rapid Fire', color: 0xfcc934, duration: 8 },
      { type: 'infinite_ammo', name: 'Infinite Overdrive', color: 0x00e5ff, duration: 8 },
      { type: 'shield', name: 'Shield Protection', color: 0x4285f4, duration: 8 },
      { type: 'health_boost', name: 'Health Boost', color: 0x2ecc71, duration: 1 },
      { type: 'army_multiplier', name: 'Army Multiplier', color: 0xab47bc, duration: 1 },
      { type: 'golden_weapon', name: 'Golden Weapon', color: 0xffd700, duration: 10 },
      { type: 'explosive_bullets', name: 'Explosive Bullets', color: 0xff6d00, duration: 8 },
      { type: 'laser_attack', name: 'Laser Attack', color: 0x18ffff, duration: 8 },
      { type: 'invincibility', name: 'Invincibility', color: 0xf538a0, duration: 7 }
    ];
    const pick = list[Math.floor(rng() * list.length)];
    return { x, z, ...pick };
  }

  buildEnemyWave(z, levelNum, virtualSquad, rng) {
    const normalPool = ['standard', 'heavy_armor', 'shield', 'fast_attacker', 'rifle', 'hmg_enemy'];
    const specialPool = ['giant_mutant', 'armored_brute', 'fire_warrior', 'electric_warrior', 'explosive_enemy', 'elite_commander'];

    const maxCount = Math.min(24, Math.max(3, Math.floor(virtualSquad * 0.45) + Math.min(10, Math.floor(levelNum / 4))));
    const units = [];

    for (let i = 0; i < maxCount; i++) {
      const isSpec = levelNum >= 6 && i === 0 && rng() < 0.35;
      const pool = isSpec ? specialPool : normalPool;
      const type = pool[Math.floor(rng() * Math.min(pool.length, 2 + Math.floor(levelNum / 3)))];

      const row = Math.floor(i / 5);
      const col = (i % 5) - 2;
      units.push({
        type,
        x: col * 1.45 + (rng() - 0.5) * 0.35,
        z: z - row * 1.6
      });
    }

    return { z, units };
  }
}
</script>

<script type="text/plain" data-path="js/camera.js">
import * as THREE from 'three';

export class CameraController {
  constructor(camera, settings) {
    this.camera = camera;
    this.settings = settings;
    this.shakeIntensity = 0;
    this.currentPos = new THREE.Vector3(0, 8.5, 11.5);
    this.lookTarget = new THREE.Vector3(0, 1.2, -10);
  }

  addShake(amount = 0.35) {
    if (!this.settings.state.cameraShake) return;
    this.shakeIntensity = Math.min(1.1, this.shakeIntensity + amount);
  }

  update(dt, mode, playerX, playerY, playerZ, squadCount, bossEngaged) {
    if (mode === 'menu') {
      const t = performance.now() * 0.0005;
      this.camera.position.set(Math.sin(t) * 2.4, 3.2, 6.2);
      this.camera.lookAt(0, 1.35, 0);
      return;
    }

    const crowdZoom = Math.min(6.5, Math.sqrt(Math.max(1, squadCount)) * 0.48);
    const bossZoom = bossEngaged ? -1.4 : 0;

    const targetX = playerX * 0.45;
    const targetY = 7.4 + crowdZoom * 0.65 + bossZoom * 0.3;
    const targetZ = playerZ + 10.2 + crowdZoom + bossZoom;

    const smooth = Math.min(1, dt * 6.5);
    this.currentPos.x += (targetX - this.currentPos.x) * smooth;
    this.currentPos.y += (targetY - this.currentPos.y) * smooth;
    this.currentPos.z += (targetZ - this.currentPos.z) * smooth;

    let shakeX = 0;
    let shakeY = 0;
    if (this.shakeIntensity > 0) {
      shakeX = (Math.random() - 0.5) * this.shakeIntensity;
      shakeY = (Math.random() - 0.5) * this.shakeIntensity;
      this.shakeIntensity = Math.max(0, this.shakeIntensity - dt * 2.8);
    }

    this.camera.position.set(
      this.currentPos.x + shakeX,
      this.currentPos.y + shakeY,
      this.currentPos.z
    );

    this.lookTarget.set(playerX * 0.3, 1.2, playerZ - 14);
    this.camera.lookAt(this.lookTarget);
  }
}
</script>

<script type="text/plain" data-path="js/effects.js">
import * as THREE from 'three';

const MAX_PARTICLES = 180;

export class EffectsManager {
  constructor(scene, camera) {
    this.scene = scene;
    this.camera = camera;
    this.floatingLayer = document.getElementById('floating-layer');
    this.dummy = new THREE.Object3D();
    this.particles = [];

    const geo = new THREE.BoxGeometry(0.22, 0.22, 0.22);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    this.instMesh = new THREE.InstancedMesh(geo, mat, MAX_PARTICLES);
    this.scene.add(this.instMesh);

    for (let i = 0; i < MAX_PARTICLES; i++) {
      this.particles.push({
        active: false,
        x: 0,
        y: -100,
        z: 0,
        vx: 0,
        vy: 0,
        vz: 0,
        scale: 1,
        life: 0,
        color: new THREE.Color(0xffffff)
      });
    }
  }

  spawnParticle(x, y, z, vx, vy, vz, colorHex, scale = 1, life = 0.45) {
    for (let i = 0; i < MAX_PARTICLES; i++) {
      const p = this.particles[i];
      if (!p.active) {
        p.active = true;
        p.x = x;
        p.y = y;
        p.z = z;
        p.vx = vx;
        p.vy = vy;
        p.vz = vz;
        p.scale = scale;
        p.life = life;
        p.color.setHex(colorHex);
        this.instMesh.setColorAt(i, p.color);
        if (this.instMesh.instanceColor) {
          this.instMesh.instanceColor.needsUpdate = true;
        }
        return;
      }
    }
  }

  spawnHitSpark(x, y, z, colorHex = 0xffeb3b) {
    for (let i = 0; i < 4; i++) {
      this.spawnParticle(
        x, y, z,
        (Math.random() - 0.5) * 8,
        Math.random() * 6 + 2,
        (Math.random() - 0.5) * 8,
        colorHex,
        0.8,
        0.28
      );
    }
  }

  spawnExplosion(x, y, z, colorHex = 0xff5722) {
    for (let i = 0; i < 16; i++) {
      this.spawnParticle(
        x, y + 0.5, z,
        (Math.random() - 0.5) * 16,
        Math.random() * 12 + 3,
        (Math.random() - 0.5) * 16,
        i % 2 === 0 ? colorHex : 0xfcc934,
        1.6,
        0.55
      );
    }
  }

  spawnFloatingText(worldX, worldY, worldZ, text, color = '#fcc934') {
    if (!this.floatingLayer) return;
    const vec = new THREE.Vector3(worldX, worldY, worldZ);
    vec.project(this.camera);

    const x = (vec.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-(vec.y * 0.5) + 0.5) * window.innerHeight;

    const el = document.createElement('div');
    el.className = 'floating-text';
    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
    el.style.color = color;
    el.textContent = text;
    this.floatingLayer.appendChild(el);

    setTimeout(() => {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 750);
  }

  update(dt) {
    this.instMesh.count = MAX_PARTICLES;

    for (let i = 0; i < MAX_PARTICLES; i++) {
      const p = this.particles[i];
      if (!p.active) {
        this.dummy.position.set(0, -200, 0);
        this.dummy.scale.set(0, 0, 0);
        this.dummy.updateMatrix();
        this.instMesh.setMatrixAt(i, this.dummy.matrix);
        continue;
      }

      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.z += p.vz * dt;
      p.vy -= 18.0 * dt;
      p.life -= dt;

      if (p.life <= 0) {
        p.active = false;
        continue;
      }

      const s = p.scale * Math.max(0.1, p.life * 2);
      this.dummy.position.set(p.x, p.y, p.z);
      this.dummy.scale.set(s, s, s);
      this.dummy.updateMatrix();
      this.instMesh.setMatrixAt(i, this.dummy.matrix);
    }

    this.instMesh.instanceMatrix.needsUpdate = true;
  }
}
</script>

<script type="text/plain" data-path="js/controls.js">
export class ControlsManager {
  constructor(canvas, settings, callbacks) {
    this.canvas = canvas;
    this.settings = settings;
    this.callbacks = callbacks;

    this.keys = { left: false, right: false };
    this.isDragging = false;
    this.lastPointerX = 0;
    this.lastPointerY = 0;

    this.bindEvents();
  }

  bindEvents() {
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') this.keys.left = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') this.keys.right = true;
      if (e.code === 'KeyW' || e.code === 'ArrowUp') this.callbacks.onJump();
      if (e.code === 'Space') {
        if (this.callbacks.isPlaying()) e.preventDefault();
        this.callbacks.onSpecial();
      }
      if (e.code === 'Escape') this.callbacks.onPauseToggle();
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') this.keys.left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') this.keys.right = false;
    });

    this.canvas.addEventListener('pointerdown', (e) => {
      if (!this.callbacks.isPlaying()) return;
      this.isDragging = true;
      this.lastPointerX = e.clientX;
      this.lastPointerY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!this.isDragging || !this.callbacks.isPlaying()) return;
      const dx = e.clientX - this.lastPointerX;
      const dy = e.clientY - this.lastPointerY;
      this.lastPointerX = e.clientX;
      this.lastPointerY = e.clientY;

      const sens = this.settings.state.sensitivity || 1.0;
      this.callbacks.onHorizontalDrag((dx / window.innerWidth) * 16.5 * sens);

      if (dy < -32) {
        this.callbacks.onJump();
      }
    });

    window.addEventListener('pointerup', () => {
      this.isDragging = false;
    });
  }

  getKeyboardSteer() {
    let dir = 0;
    if (this.keys.left) dir -= 1;
    if (this.keys.right) dir += 1;
    return dir * (this.settings.state.sensitivity || 1.0);
  }
}
</script>

import * as THREE from 'three';
import { PlayerCommander } from './player.js';
